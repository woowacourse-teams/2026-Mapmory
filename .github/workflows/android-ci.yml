name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Android changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}

    steps:
      - name: Checkout source
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Detect Android-related paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - '.github/workflows/android-ci.yml'
              - 'client/androidApp/**'
              - 'client/shared/build.gradle.kts'
              - 'client/shared/src/commonMain/**'
              - 'client/shared/src/commonTest/**'
              - 'client/shared/src/androidMain/**'
              - 'client/shared/src/androidHostTest/**'
              - 'client/shared/src/androidDeviceTest/**'
              - 'client/shared/src/jvmMain/**'
              - 'client/shared/src/jvmTest/**'
              - 'client/gradle/**'
              - 'client/build.gradle.kts'
              - 'client/settings.gradle.kts'
              - 'client/gradle.properties'
              - 'client/gradlew'
              - 'client/gradlew.bat'

  android:
    name: Test and build Android
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and build Android
        run: ./gradlew :shared:jvmTest :shared:testAndroidHostTest :androidApp:lint :androidApp:assembleDebug --no-daemon
