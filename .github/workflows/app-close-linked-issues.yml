name: App Close Linked Issues

# 앱(안드로이드·iOS) PR은 기본 브랜치(main)가 아닌 develop에 머지되므로 GitHub의 "Closes #N" 자동 닫기가 동작하지 않는다.
# develop에 PR이 머지되면 PR 본문과 커밋 메시지의 닫기 키워드를 읽어 이슈를 닫는다.
# 백엔드(backend-develop)는 backend-close-linked-issues.yml이 따로 맡는다.

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  close-issues:
    name: Close issues referenced by the merged app PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close referenced issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // GitHub와 같은 닫기 키워드. 키워드마다 이슈 번호가 하나씩 와야 한다(close #1, close #2).
            // 다른 레포 참조(owner/repo#N)는 제외하고 이 레포의 #N만 닫는다.
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;

            const texts = [pr.body ?? ''];
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            for (const commit of commits) {
              texts.push(commit.commit.message);
            }

            const numbers = new Set();
            for (const text of texts) {
              for (const match of text.matchAll(pattern)) {
                numbers.add(Number(match[1]));
              }
            }

            if (numbers.size === 0) {
              core.info('닫을 이슈가 없습니다.');
              return;
            }

            for (const number of numbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (error) {
                core.warning(`#${number}을(를) 찾지 못했습니다: ${error.message}`);
                continue;
              }

              if (issue.pull_request) {
                core.info(`#${number}은(는) 이슈가 아니라 PR이라 건너뜁니다.`);
                continue;
              }
              if (issue.state === 'closed') {
                core.info(`#${number}은(는) 이미 닫혀 있습니다.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `#${pr.number}이(가) \`${pr.base.ref}\`에 머지되어 닫습니다.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`#${number}을(를) 닫았습니다.`);
            }
