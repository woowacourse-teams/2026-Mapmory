name: Backend Semgrep

# 리뷰에서 배운 규칙 중 코드 모양만으로 판별할 수 있는 것(.semgrep/)을 매번 검사한다.
# 같은 코드에 늘 같은 결과를 내므로, Claude 리뷰가 놓치거나 흔들려도 이 검사는 잡는다.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".semgrep/**"
      - ".semgrepignore"
      - ".github/workflows/backend-semgrep.yml"
      - ".github/claude-review/signals.py"

permissions:
  contents: read

concurrency:
  group: backend-semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Semgrep
        run: pip install --quiet semgrep

      - name: Scan
        run: |
          semgrep scan --metrics=off --disable-version-check --config .semgrep --json backend/src > /tmp/semgrep.json || true
          python3 -I .github/claude-review/signals.py semgrep /tmp/semgrep.json /tmp/semgrep.md
          { echo "## Semgrep"; echo; cat /tmp/semgrep.md; } >> "$GITHUB_STEP_SUMMARY"
          # 규칙 오류로 검사가 돌지 않았으면 통과로 보이지 않게 실패시킨다.
          jq -e '.errors | length == 0' /tmp/semgrep.json > /dev/null || { echo "::error::Semgrep 규칙을 실행하지 못했다"; jq '.errors' /tmp/semgrep.json; exit 1; }
          jq -e '.results | length == 0' /tmp/semgrep.json > /dev/null || { echo "::error::리뷰에서 배운 규칙에 걸린 코드가 있다. 경고를 보고 고친다."; exit 1; }
