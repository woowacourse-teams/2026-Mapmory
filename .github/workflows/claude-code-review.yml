name: Claude Code Review

# 백엔드 PR이 열릴 때(드래프트를 해제할 때) 한 번 리뷰하고, 그 뒤에는 `claude-review` 라벨을 붙일 때만 다시 리뷰한다.
# 커밋마다 PR 전체를 다시 리뷰하면 같은 내용을 반복해 읽고 비용만 늘어서, 다시 볼 시점은 사람이 정한다.
# 필요한 것: 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN(`claude setup-token`으로 발급) 또는 ANTHROPIC_API_KEY.
# Claude GitHub App은 조직 owner만 저장소를 추가할 수 있어, 앱 대신 Actions 기본 토큰으로 코멘트를 단다(github-actions[bot]).
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]
    paths:
      - "backend/**"
      - "api.md"
      - ".github/workflows/claude-code-review.yml"
      - ".github/claude-review/review.md"
      - ".github/claude-review/guide.md"
      - ".github/claude-review/domain.md"
      - ".github/claude-review/policies.md"
      - ".semgrep/**"
      - ".github/claude-review/signals.py"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크 PR은 시크릿을 받지 못하고, 봇 PR과 드래프트는 리뷰하지 않는다. 라벨은 claude-review만 리뷰를 다시 요청한다.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 기계 검사 결과를 먼저 만들어 Claude에게 넘긴다. Claude는 같은 걸 다시 찾지 않고, 결과가 진짜 문제인지 판단한다.
      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .claude-review-input
          gh pr diff "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --name-only > .claude-review-input/changed.txt
          # PIT 대상 목록(build.gradle) 중 이 PR에서 바뀐 클래스
          classes=$(grep -E '^backend/src/main/java/.*\.java$' .claude-review-input/changed.txt \
            | sed -E 's#^backend/src/main/java/##; s#\.java$##; s#/#.#g' \
            | while read -r c; do grep -q "'$c'" backend/build.gradle && echo "$c"; done | paste -sd, -)
          echo "PIT_CLASSES=$classes" >> "$GITHUB_ENV"
          echo "PIT 대상: ${classes:-없음}"

      - name: Semgrep on changed files
        run: |
          files=$(grep -E '^backend/src/.*\.java$' .claude-review-input/changed.txt | while read -r f; do [ -f "$f" ] && echo "$f"; done)
          if [ -z "$files" ]; then echo "Semgrep: 바뀐 Java 파일 없음" > .claude-review-input/semgrep.md; exit 0; fi
          pip install --quiet semgrep==1.186.0
          # shellcheck disable=SC2086
          semgrep scan --metrics=off --disable-version-check --config .semgrep --json $files > /tmp/semgrep.json || true
          python3 -I .github/claude-review/signals.py semgrep /tmp/semgrep.json .claude-review-input/semgrep.md

      - name: Set up Java for mutation test
        if: env.PIT_CLASSES != ''
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Set up Gradle for mutation test
        if: env.PIT_CLASSES != ''
        uses: gradle/actions/setup-gradle@v5

      # 대상 클래스가 바뀐 PR에서만, 바뀐 클래스만 돌린다. 실패해도 리뷰는 계속한다.
      - name: Mutation test on changed classes
        if: env.PIT_CLASSES != ''
        working-directory: backend
        timeout-minutes: 15
        run: |
          chmod +x gradlew
          if ./gradlew pitest -PpitTargetClasses="$PIT_CLASSES" --no-daemon -q; then
            python3 -I ../.github/claude-review/signals.py pit build/reports/pitest/mutations.xml ../.claude-review-input/pit.md
          else
            echo "PIT: 실행하지 못했다. 이번 리뷰는 PIT 없이 한다." > ../.claude-review-input/pit.md
            echo "::warning title=PIT::뮤테이션 테스트를 실행하지 못했다"
          fi

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API 키를 쓸 때는 위 줄 대신 아래 줄을 쓴다.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 결과를 한국어로 남겨라.
            `.github/claude-review/review.md`의 기준을 먼저 읽고 그대로 따른다. 특히 "무엇을 남기나: 정확성만"과 "거르기" 단계를 지킨다.
            `.github/claude-review/guide.md`(배운 규칙), `.github/claude-review/domain.md`(PR이 건드린 패키지의 절만),
            `.github/claude-review/policies.md`(PR이 건드린 흐름의 표와 데이터 분리 규칙만)는 의심 찾기에 쓴다.
            PR 설명의 "결정"(내가 정한 것, AI 제안을 받아들인 것)과 연결된 이슈의 "정한 것"을 불변식의 근거로 쓰고, 코드가 그와 다르면 지적한다.
            `.claude-review-input/`에 기계 검사 결과가 있다(semgrep.md, 있으면 pit.md). review.md의 "기계 검사 결과" 절대로 판단한다.

            결과를 남기는 방법:
            - 특정 줄의 문제는 mcp__github_inline_comment__create_inline_comment로 인라인 코멘트를 단다.
              각 코멘트에 심각도(Critical/Major/Minor), 틀린 결과가 나오는 입력이나 실행 순서, 가능하면 수정 제안을 쓴다.
              guide.md의 규칙 덕분에 찾은 문제면 제목 앞에 규칙 ID를 붙인다(예: `[R-001] [Major] ...`).
            - 이전 리뷰에서 이미 단 지적과 같은 내용은 다시 달지 않는다(`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`로 확인한다).
            - 요약은 review.md의 "요약 형식"대로 15줄 이내로 쓰고 `gh pr comment --edit-last --create-if-none`으로 남겨 이전 요약을 고친다.
              확인해 보니 문제없는 것의 목록은 쓰지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Grep,Glob,WebFetch(domain:docs.github.com),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:docs.spring.io),WebFetch(domain:docs.oracle.com),WebFetch(domain:javadoc.io),WebFetch(domain:www.javadoc.io),WebFetch(domain:dev.mysql.com),WebFetch(domain:docs.aws.amazon.com),WebFetch(domain:hibernate.org),WebFetch(domain:docs.jboss.org),WebFetch(domain:junit.org),WebFetch(domain:site.mockito.org),WebFetch(domain:assertj.github.io)"

      # 다시 요청할 수 있게, 라벨로 시작한 리뷰는 끝나면 라벨을 뗀다. 실패해도 리뷰 결과에는 영향이 없다.
      - name: Remove review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" -R "${{ github.repository }}" --remove-label claude-review || true
