name: Claude Code Review

# 백엔드 PR이 열리거나 커밋이 추가될 때 Claude가 자동으로 리뷰한다.
# 필요한 것: 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN(`claude setup-token`으로 발급) 또는 ANTHROPIC_API_KEY.
# Claude GitHub App은 조직 owner만 저장소를 추가할 수 있어, 앱 대신 Actions 기본 토큰으로 코멘트를 단다(github-actions[bot]).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "backend/**"
      - "api.md"
      - ".github/workflows/claude-code-review.yml"
      - ".github/claude-review/review.md"
      - ".github/claude-review/guide.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크 PR은 시크릿을 받지 못하고, 봇 PR과 드래프트는 리뷰하지 않는다.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API 키를 쓸 때는 위 줄 대신 아래 줄을 쓴다.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 결과를 한국어로 남겨라.
            `.github/claude-review/review.md`의 기준과 `.github/claude-review/guide.md`의 배운 규칙을 먼저 읽고 그대로 따른다.
            특히 review.md의 "의심하고, 확인한다" 두 단계를 건너뛰지 않는다. 라이브러리 동작은 WebFetch로 소스나 공식 문서를 열어 확인한다.

            결과를 남기는 방법:
            - 특정 줄의 문제는 mcp__github_inline_comment__create_inline_comment로 인라인 코멘트를 단다.
              각 코멘트에 심각도(Critical/Major/Minor/Nit), 이유, 가능하면 수정 제안을 쓴다.
              guide.md의 규칙 덕분에 찾은 문제면 제목 앞에 규칙 ID를 붙인다(예: `[R-001] [Major] ...`).
            - 전체 요약은 `gh pr comment --edit-last --create-if-none`으로 남겨, 커밋마다 새 코멘트가 쌓이지 않고 이전 요약을 고친다.
              제목에 검토한 커밋 SHA(7자리)를 적는다. 이전 요약에 있던 지적은 지우지 말고 "이전 커밋에서 지적한 것"에 커밋 SHA와 함께
              한 줄씩 남겨, 학습 워크플로가 커밋마다 무엇을 잡았는지 알 수 있게 한다. 문제가 없으면 짧게 그렇게 쓴다.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,WebFetch(domain:docs.github.com),WebFetch(domain:github.com),WebFetch(domain:raw.githubusercontent.com),WebFetch(domain:docs.spring.io),WebFetch(domain:docs.oracle.com),WebFetch(domain:javadoc.io),WebFetch(domain:www.javadoc.io),WebFetch(domain:dev.mysql.com),WebFetch(domain:docs.aws.amazon.com),WebFetch(domain:hibernate.org),WebFetch(domain:docs.jboss.org),WebFetch(domain:junit.org),WebFetch(domain:site.mockito.org),WebFetch(domain:assertj.github.io)"
