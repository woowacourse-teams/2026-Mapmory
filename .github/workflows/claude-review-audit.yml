name: Claude Review Audit

# PR 리뷰는 PR이 건드린 곳만 본다. 1주에 한 번 backend-develop 전체 코드를 리뷰 기준(domain.md, policies.md, ADR)과 대조해
# 이미 머지된 모순을 이슈로 올린다. 문서와 코드는 고치지 않는다. 지침은 .github/claude-review/audit.md.
# schedule은 main에 이 파일이 있어야 돈다. 그 전에는 backend-develop push마다 문지기(weekly-gate.sh)가
# 지난 7일 안에 점검이 성공했는지 보고, 없을 때만 돈다.
on:
  schedule:
    - cron: "43 1 * * 3" # 매주 수요일 10:43 KST
  workflow_dispatch:
  push:
    branches: [backend-develop]
    paths:
      - "backend/**"

permissions:
  contents: read

concurrency:
  group: claude-review-audit
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/claude-review
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            bash .github/claude-review/weekly-gate.sh "${{ github.repository }}" claude-review-audit.yml audit "${{ github.run_id }}"
          fi

  audit:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Claude는 읽기 권한 토큰만 받는다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      found: ${{ steps.result.outputs.found }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: backend-develop
          fetch-depth: 1

      - name: Collect known issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .audit
          {
            echo "# 이미 알린 것"
            echo
            echo "## 지난 도메인 점검 이슈"
            gh issue list -R "${{ github.repository }}" --state all --search "도메인 점검 in:title" --limit 3 --json number,title,body \
              --jq '.[] | "### #\(.number) \(.title)\n\n\(.body | .[0:6000])\n"' || true
            echo
            echo "## 열린 이슈"
            gh issue list -R "${{ github.repository }}" --state open --limit 100 --json number,title --jq '.[] | "- #\(.number) \(.title)"' || true
            echo
            echo "## 열린 PR"
            gh pr list -R "${{ github.repository }}" --state open --limit 100 --json number,title --jq '.[] | "- #\(.number) \(.title)"' || true
          } > .audit/known.md

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "\`.github/claude-review/audit.md\`의 지침을 읽고 그대로 따른다. 입력 데이터는 \`.audit/\`에 있다." \
            --model claude-opus-5-5 \
            --allowedTools "Read,Grep,Glob,Write,Bash(git log:*),Bash(git show:*)" \
            --output-format json > .audit/claude-output.json
          test -f .audit/findings.md || echo "결과가 없다. Claude 출력: $(jq -r '.result' .audit/claude-output.json)" > .audit/findings.md

      - id: result
        run: |
          # "새로 찾은 모순"이나 "문서 갱신 대상"에 내용이 있으면 이슈를 연다.
          if awk '/^## (새로 찾은 모순|문서 갱신 대상)/{s=1;next} /^## /{s=0} s && /^(### |- )/ && !/^- *없음[.]? *$/{found=1} END{exit !found}' .audit/findings.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          count=$(grep -c '^### ' .audit/findings.md || true)
          echo "::notice title=도메인 점검::새로 찾은 모순 ${count:-0}건"
          { echo "## 도메인 점검"; echo; cat .audit/findings.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-review-audit
          path: .audit/findings.md

  report:
    needs: audit
    if: needs.audit.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-review-audit
          path: /tmp/audit
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "\`backend-develop\` 전체 코드를 리뷰 기준(\`domain.md\`, \`policies.md\`, ADR)과 대조했다. 문서와 코드는 고치지 않았다."
            echo "항목마다 코드를 고칠지, 결정을 ADR로 남길지, 오탐인지 정한다."
            echo
            cat /tmp/audit/findings.md
            echo
            echo "실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          gh issue create -R "${{ github.repository }}" --title "chore: 도메인 점검 $(date -u +%Y-%m-%d)" --body-file body.md
