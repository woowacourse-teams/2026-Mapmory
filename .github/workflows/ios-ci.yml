name: iOS CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout source
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Detect iOS-related paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - '.github/workflows/ios-ci.yml'
              - 'client/iosApp/**'
              - 'client/shared/build.gradle.kts'
              - 'client/shared/src/commonMain/**'
              - 'client/shared/src/commonTest/**'
              - 'client/shared/src/iosMain/**'
              - 'client/shared/src/iosTest/**'
              - 'client/gradle/**'
              - 'client/build.gradle.kts'
              - 'client/settings.gradle.kts'
              - 'client/gradle.properties'
              - 'client/gradlew'
              - 'client/gradlew.bat'

  ios:
    # Required check name on develop and main.
    name: Build iOS Simulator
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check Swift syntax
        run: git ls-files -z -- "client/iosApp/*.swift" | xargs -0 xcrun swiftc -frontend -parse

  ios-device:
    name: Build unsigned iOS app
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mapmory-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-isolated-v1-${{ hashFiles('client/iosApp/Mapmory.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project client/iosApp/Mapmory.xcodeproj \
            -scheme Mapmory \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/mapmory-source-packages" \
            -disablePackageRepositoryCache \
            -derivedDataPath "$RUNNER_TEMP/mapmory-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            build
