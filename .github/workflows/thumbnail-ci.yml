name: Thumbnail CI

on:
  pull_request:
    paths:
      - "thumbnail/**"
      - ".github/workflows/thumbnail-ci.yml"
  push:
    branches: [main]
    paths:
      - "thumbnail/**"
      - ".github/workflows/thumbnail-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnail-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test thumbnail script
    # 렌더러 서버(Amazon Linux 2023, arm64)와 같은 OS·CPU·Python에서 돌린다.
    runs-on: ubuntu-24.04-arm
    container: amazonlinux:2023
    timeout-minutes: 10

    steps:
      # 체크아웃에 git과 tar가 필요한데 기본 이미지에 없다. 렌더러와 같이 dnf로 Python 3.12를 설치한다.
      - name: Install system packages
        run: dnf install -y --quiet git tar gzip python3.12

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        working-directory: thumbnail
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt

      - name: Run tests
        working-directory: thumbnail
        run: .venv/bin/python -m pytest -q
