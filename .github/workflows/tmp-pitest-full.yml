name: Tmp PIT full

# 임시: PIT 대상 7개 클래스 전체의 살아남은 변이를 본다. PR을 올리기 전에 지운다.
on:
  pull_request:
    paths:
      - ".github/workflows/tmp-pitest-full.yml"
      - "backend/src/test/**"

permissions:
  contents: read

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: PIT
        working-directory: backend
        run: |
          chmod +x gradlew
          start=$(date +%s)
          ./gradlew pitest --no-daemon -q
          echo "::notice title=PIT 시간::$(( $(date +%s) - start ))초"
          python3 -I ../.github/claude-review/signals.py pit build/reports/pitest/mutations.xml /tmp/pit.md
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections
          root = ET.parse("build/reports/pitest/mutations.xml").getroot()
          c = collections.defaultdict(lambda: [0, 0])
          for m in root.iter("mutation"):
              k = m.findtext("mutatedClass").split(".")[-1]
              c[k][0] += 1
              c[k][1] += m.get("status") not in ("SURVIVED", "NO_COVERAGE")
          print("::notice title=클래스별::" + ", ".join(f"{k} {v[1]}/{v[0]}" for k, v in sorted(c.items())))
          PY
