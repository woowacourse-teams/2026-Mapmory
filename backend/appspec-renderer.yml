version: 0.0
os: linux

files:
  - source: mapmory-backend.jar
    destination: /opt/mapmory-renderer
  - source: video-renderer
    destination: /opt/mapmory-renderer/video-renderer
  - source: mapmory-render-worker.service
    destination: /etc/systemd/system

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/health-check.sh
      timeout: 180
      runas: root
