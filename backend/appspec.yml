version: 0.0
os: linux

files:
  - source: mapmory-backend.jar
    destination: /opt/mapmory/deploy-staging
  - source: systemd/mapmory.service
    destination: /etc/systemd/system
  - source: systemd/mapmory-green.service
    destination: /etc/systemd/system

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: scripts/bootstrap-blue-green.sh
      timeout: 240
      runas: root

  AfterInstall:
    - location: scripts/prepare-inactive-slot.sh
      timeout: 240
      runas: root

  ApplicationStart:
    - location: scripts/switch-traffic.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate-and-retain.sh
      timeout: 720
      runas: root
