plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.mapmory'
version = '0.0.1-SNAPSHOT'
description = 'mapmory-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.20.0'
    implementation 'com.bucket4j:bucket4j_jdk17-mysql:8.20.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation platform('software.amazon.awssdk:bom:2.32.29')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront'

    implementation 'com.google.firebase:firebase-admin:9.11.0'
    // Google Places 호출 클라이언트. firebase-admin도 끌고 오지만 우리가 직접 쓰므로 따로 적는다.
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // CI와 같게 UTC로 둔다. hibernate.jdbc.time_zone=UTC라 JVM이 KST면 JPA로 쓴 시각만 9시간 밀려 jdbcTemplate으로 넣은 값과 어긋난다.
    systemProperty 'user.timezone', 'UTC'
    systemProperty 'logging.level.org.springframework.test.context.cache', 'DEBUG'
    // CI(CodeBuild, GitHub Actions) 로그에 실패한 테스트의 메시지와 원인을 찍는다. 기본(SHORT)은 예외 이름만 찍어
    // assertThat(...).as(...)로 남긴 실패 내용이 보이지 않았다(#753).
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.bootJar {
    archiveFileName.set("mapmory-backend.jar")
}

tasks.named('jar') {
    enabled = false
}

// 뮤테이션 테스트(PIT). 코드를 일부러 조금씩 바꿔 보고(>= → > 등) 테스트가 알아채는지 본다.
// 살아남은 변이는 경계값·예외 경로를 검증하지 않는 테스트를 가리킨다. Claude 리뷰가 PR마다 이 결과를 읽고 판단한다.
// 느려지지 않게 단위 테스트가 있는 태그·캐시 코드만 대상으로 하고, Spring·MySQL을 띄우는 통합 테스트는 넣지 않는다.
// 대상을 넓히려면 PIT_TARGET_CLASSES와 PIT_TARGET_TESTS에 단위 테스트가 있는 클래스를 함께 추가한다.
def PIT_TARGET_CLASSES = [
        'com.mapmory.backend.tag.Tag',
        'com.mapmory.backend.tag.TagName',
        'com.mapmory.backend.tag.TagService',
        'com.mapmory.backend.common.cache.MemberCacheGenerations',
        'com.mapmory.backend.common.cache.DeploymentCacheControl',
        'com.mapmory.backend.travelrecord.mapsummary.cache.MapSummaryCache',
        'com.mapmory.backend.travelrecord.application.listcache.TravelRecordListCache',
]
def PIT_TARGET_TESTS = [
        'com.mapmory.backend.tag.TagTest',
        'com.mapmory.backend.tag.TagNameTest',
        'com.mapmory.backend.tag.TagServiceTest',
        'com.mapmory.backend.common.cache.MemberCacheGenerationsTest',
        'com.mapmory.backend.common.cache.DeploymentCacheTest',
        'com.mapmory.backend.travelrecord.mapsummary.cache.MapSummaryCacheTest',
        'com.mapmory.backend.travelrecord.application.listcache.TravelRecordListCacheTest',
]

pitest {
    junit5PluginVersion = '1.2.3'
    // PR에서 바뀐 클래스만 돌리려고 -PpitTargetClasses=a,b로 좁힐 수 있다. 대상 목록 밖의 클래스는 무시한다.
    def requested = (findProperty('pitTargetClasses') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
    targetClasses = requested ? PIT_TARGET_CLASSES.findAll { it in requested } : PIT_TARGET_CLASSES
    targetTests = PIT_TARGET_TESTS
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    jvmArgs = ['-Duser.timezone=UTC']
    // 동시성 테스트가 몇 초씩 기다리므로, 변이 때문에 멈춘 실행만 시간 초과로 끊는다.
    timeoutConstInMillis = 10000
}
