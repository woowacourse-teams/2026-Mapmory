version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - cd backend
      - chmod +x gradlew
      - chmod +x scripts/*.sh

  build:
    commands:
      - ./gradlew clean build --no-daemon

  post_build:
    commands:
      - mkdir -p deploy/scripts
      - mkdir -p deploy/systemd
      - cp build/libs/mapmory-backend.jar deploy/
      - cp appspec.yml deploy/
      - cp scripts/*.sh deploy/scripts/
      - cp systemd/*.service deploy/systemd/
      - cp -R observability deploy/
      # 배포 버전은 빌드한 커밋 앞 7자리다. prepare-inactive-slot.sh가 릴리스 폴더의 app-version.env로 옮긴다.
      - printf '%s\n' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7 > deploy/VERSION

artifacts:
  base-directory: backend/deploy
  files:
    - "**/*"
  discard-paths: no