spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

jwt:
  secret: ${JWT_SECRET}

logging:
  file:
    name: /var/log/mapmory/application.log

  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: dev
        version: ${APP_VERSION:unknown}
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info
    org.springframework.boot.autoconfigure: info

management:
  server:
    port: 8081
    address: 127.0.0.1

  metrics:
    tags:
      environment: dev
