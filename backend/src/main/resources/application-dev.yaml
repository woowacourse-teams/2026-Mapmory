# Vercel 관리자 페이지에서 API 세션 쿠키를 보내려면 cross-site 쿠키가 필요하다.
server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

jwt:
  secret: ${JWT_SECRET}

admin:
  cors:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:4174,http://127.0.0.1:4174}

logging:
  file:
    name: /var/log/mapmory/application.log

  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: dev
        version: ${APP_VERSION:unknown}
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info
    org.springframework.boot.autoconfigure: info

management:
  server:
    port: 8081
    address: 127.0.0.1

  metrics:
    tags:
      environment: dev
