server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  datasource:
    # socketTimeout은 쿼리를 보낸 뒤 DB 응답을 기다리는 한도다. 넘으면 드라이버가 그 연결을 끊는다.
    # 없으면(기본 0 = 무한) DB가 신호 없이 멈췄을 때(서버 정지, 장애 전환) 쿼리 중이던 요청이 커넥션을 쥔 채 멈춰 풀 10개가 묶인다.
    # MySQL 잠금 대기 한도(innodb_lock_wait_timeout, 최소 1초)보다 길어야 한다. 짧으면 잠금 대기 초과(1205)를
    # 503으로 답하는 처리(LockConflictExceptionHandler)보다 먼저 연결이 끊겨 500이 된다. 그래서 1초가 아니라 3초로 둔다.
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8&socketTimeout=3000
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      # 풀에서 커넥션을 기다리는 한도다. DB가 같은 VPC에 있어 새 연결도 평소 수십 ms라, 0.5초를 넘게 기다리면 이미 비정상이다.
      # Hikari가 이 값을 초 단위로 올려(최소 1초) 드라이버 로그인 타임아웃으로 넘기므로 TCP 연결·인증 대기도 1초에 끊긴다.
      connection-timeout: 500
  flyway:
    # 마이그레이션은 socketTimeout 없는 주소로 따로 붙는다. ALTER TABLE처럼 3초를 넘는 문장이 배포 중에 끊기면 안 된다.
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8
    user: ${DB_USER}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

admin:
  cors:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS}

logging:
  file:
    name: /var/log/mapmory/application.log

  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: prod
        version: ${APP_VERSION:unknown}
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info
    org.springframework.boot.autoconfigure: info

management:
  server:
    port: 8081
    address: 127.0.0.1

  metrics:
    tags:
      environment: prod
