server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  datasource:
    # socketTimeout은 쿼리를 보낸 뒤 DB 응답을 기다리는 한도다. 넘으면 드라이버가 그 연결을 끊는다.
    # 드라이버가 연결을 닫으면서 남은 응답을 한 번 더 읽어, 서버가 계속 답이 없으면 실제로는 두 배(약 6초) 뒤에 풀려난다
    # (DatabaseTimeoutBehaviorTest).
    # 없으면(기본 0 = 무한) DB가 신호 없이 멈췄을 때(서버 정지, 장애 전환) 쿼리 중이던 요청이 커넥션을 쥔 채 멈춰 풀 10개가 묶인다.
    # sessionVariables는 이 연결의 잠금 대기 한도(innodb_lock_wait_timeout)를 MySQL 기본 50초에서 1초로 줄인다.
    # 평소 잠금은 수십 ms만 쥐므로 1초를 기다려도 안 풀리면 비정상이다. 그때는 1205로 실패해 503 + Retry-After로 답한다
    # (LockConflictExceptionHandler). MySQL이 한도를 초 단위로 확인해 실제로는 2초 가까이 걸릴 수 있다.
    # socketTimeout은 이 한도보다 길어야 한다. 짧으면 1205가 오기 전에 연결이 끊겨 500이 된다. 그래서 3초로 둔다.
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8&socketTimeout=3000&sessionVariables=innodb_lock_wait_timeout=1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      # 풀에서 커넥션을 기다리는 한도다. DB가 같은 VPC에 있어 새 연결도 평소 수십 ms라, 0.5초를 넘게 기다리면 이미 비정상이다.
      # Hikari가 이 값을 초 단위로 올려(최소 1초) 드라이버 로그인 타임아웃으로 넘기므로 TCP 연결·인증 대기도 1초에 끊긴다.
      connection-timeout: 500
  flyway:
    # 마이그레이션은 socketTimeout과 잠금 대기 한도를 걸지 않은 주소로 따로 붙는다. ALTER TABLE처럼 3초를 넘는 문장이 배포 중에 끊기면 안 된다.
    url: jdbc:mysql://${DB_HOST}:3306/mapmory?serverTimezone=UTC&characterEncoding=UTF-8
    user: ${DB_USER}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

admin:
  cors:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS}

logging:
  file:
    name: /var/log/mapmory/application.log

  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: prod
        version: ${APP_VERSION:unknown}
  level:
    org.hibernate.SQL: warn
    org.flywaydb: info
    org.springframework.boot.autoconfigure: info

management:
  server:
    port: 8081
    address: 127.0.0.1

  metrics:
    tags:
      environment: prod
