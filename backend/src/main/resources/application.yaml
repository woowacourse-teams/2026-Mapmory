spring:
  application:
    name: mapmory-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 서명 키(jwt.secret)는 프로파일별로 주입한다. (local: application-local, prod: 환경변수)
  access-token-validity: PT30M
  refresh-token-validity: P14D
  # 게스트 전용. 만료되면 복구 수단이 없으므로 회원(14일)보다 길게 둔다. (ADR 0015)
  guest-refresh-token-validity: P365D

guest-login:
  rate-limit:
    # 게스트는 인증 없이 생성되므로 출처별로 제한한다. 이동통신 NAT로 여러 사용자가 한 IP를
    # 공유할 수 있어, 정상 사용을 막지 않을 만큼 넉넉히 두고 스크립트 남용만 걸러낸다. (ADR 0015)
    capacity: 60
    window: 1h

kakao:
  # ID token의 aud로 허용할 앱 키 목록(쉼표 구분). 네이티브 SDK로 로그인하면 네이티브 앱 키가 aud로 들어간다.
  # 비어 있으면 모든 카카오 로그인을 거부한다. (ADR 0024)
  client-ids: ${KAKAO_CLIENT_IDS:}
  jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json

google:
  # ID token의 aud로 허용할 OAuth 클라이언트 ID 목록(쉼표 구분). Android Credential Manager는
  # serverClientId로 지정한 웹 클라이언트 ID를, iOS SDK는 iOS 클라이언트 ID를 aud로 넣는다.
  # 비어 있으면 모든 구글 로그인을 거부한다. (ADR 0019)
  client-ids: ${GOOGLE_CLIENT_IDS:}
  jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  # Google 장소 검색(Places API)과 사진 좌표 → 지역(Geocoding API)이 같이 쓰는 키와 타임아웃이다.
  # 키가 비어 있으면 두 기능 모두 PLACE_PROVIDER_UNAVAILABLE로 실패한다. GCP에서 이 키에 두 API를 다 허용해야 한다. (docs/place-search.md)
  api-key: ${GOOGLE_PLACES_API_KEY:}
  # 2026-11-04 dev EC2에서 자동완성·상세를 200번 잰 값의 약 3배로 둔다. 클라이언트는 Apache HttpClient다(GoogleHttpClients).
  # connect는 TCP+TLS 연결 한도다. 잰 연결 최대 134ms × 3 = 402ms → 400ms.
  # read는 연결된 뒤 응답을 기다리는 한도다. 잰 응답 대기 p99 303ms × 3 = 909ms → 1s. 둘을 합쳐 최악 1.4초쯤 기다린다.
  # 다른 외부 호출(JWKS, 애플)은 재지 않아 spring.http.clients 공통 값(2초/3초)을 그대로 쓴다.
  connect-timeout: 400ms
  read-timeout: 1s
  # 장소 검색(places)과 사진 좌표 → 지역(geocoding)은 연결 풀·한도·서킷 브레이커를 따로 쓴다. 한쪽이 몰리거나 멈춰도 다른 쪽을 막지 않는다.
  # Google 쿼터와 월 무료 사용량이 API(SKU)마다 따로라(자동완성·상세·Geocoding 각 10,000건) 우리 한도도 API마다 둔다.
  # 호스트 주소(base-url)는 코드의 기본값을 쓴다. 테스트만 바꾼다.
  places:
    rate-limit:
      # 서버마다 메모리에서 센다. 자동완성과 상세를 합쳐 센다. 몰린 요청이 무료 사용량을 다 쓰는 데 2시간 반(9,000 / 60)은 걸리게 한다.
      # 연결 풀 크기도 이 값이다.
      requests-per-minute: 60
      # 엔드포인트(GooglePlacesEndpoint)마다 UTC 달마다 센다. 엔드포인트를 더하면 여기에도 한 줄 더한다(빠지면 기동이 실패한다).
      # 상한에 닿으면 막는다. 상한을 무료 사용량(10,000)의 두 배로 두고 무료를 넘기 전에 알림을 받는다.
      # 상한까지 다 쓰면 SKU마다 10,000건이 과금된다(자동완성 약 $28, 상세 $50).
      per-month:
        autocomplete: 20000
        details: 20000
      # 이번 달 이만큼 쓴 순간 ERROR 로그(GOOGLE_PLACES_FREE_USAGE)를 남겨 Discord로 알린다. 무료 10,000건보다 조금 앞이다.
      # Google 월은 태평양 시간 기준이라 UTC 달과 몇 시간 어긋난다.
      free-alert-at: 9000
    # Google이 멈추면 부르지도 않고 바로 실패해, 사용자가 3초씩 기다리거나 월 한도를 쓰지 않게 한다.
    # 최근 60초 동안 5번 이상 불렀고 그중 절반 이상이 타임아웃·연결 오류·5xx면 60초 동안 연다. 그 뒤 3번 시험해 본다.
    circuit-breaker:
      window: 60s
      minimum-calls: 5
      failure-rate-percent: 50
      open-duration: 60s
      half-open-calls: 3
  # 사진 좌표 → 지역(Geocoding API, POST /api/v1/places/location). 개발 서버는 application-dev.yaml에서 월 한도를 낮춘다.
  geocoding:
    rate-limit:
      # 사진 좌표 → 지역(POST /api/v1/places/location)은 글자마다 부르는 검색보다 적게 불려 작게 둔다(2026-11-06 결정).
      # 서버 한 대에서 1분에 21번째 요청부터 PLACE_RATE_LIMITED(429)다. 월 상한을 다 쓰는 데 17시간쯤(20,000 / 20) 걸린다.
      requests-per-minute: 20
      per-month: 20000
      # 이번 달 이만큼 쓴 순간 ERROR 로그(GOOGLE_GEOCODING_FREE_USAGE)를 남긴다.
      free-alert-at: 9000
    # 장소 검색과 같은 기준이다. 따로 열리고 닫힌다.
    circuit-breaker:
      window: 60s
      minimum-calls: 5
      failure-rate-percent: 50
      open-duration: 60s
      half-open-calls: 3

apple:
  # identity token의 aud로 허용할 값 목록(쉼표 구분). iOS 네이티브 로그인은 앱 번들 ID가 aud로 들어간다.
  # 웹·Android에서 Services ID로 로그인하게 되면 그 ID도 추가한다. 비어 있으면 모든 애플 로그인을 거부한다. (ADR 0020)
  client-ids: ${APPLE_CLIENT_IDS:}
  jwk-set-uri: https://appleid.apple.com/auth/keys
  # 애플 회원이 탈퇴할 때 애플 토큰을 철회하는 데 쓴다(앱스토어 심사 지침 5.1.1(v)). 로그인에는 필요 없다.
  # 비어 있으면 애플 회원 탈퇴가 APPLE_UNAVAILABLE(503)로 실패한다. (ADR 0025)
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}
  token-uri: https://appleid.apple.com/auth/token
  revoke-uri: https://appleid.apple.com/auth/revoke

travel-record:
  map-summary:
    # 회원별 지도 요약을 서버 메모리에 둔다. 일지 생성·수정·삭제, 태그 이름 변경·삭제가 커밋되면 그 회원 것을 지운다.
    # TTL은 지우기를 놓친 경우(DB 직접 수정, 조회와 커밋이 겹침, 서버 여러 대)에 옛 지도가 보일 수 있는 최대 시간이다.
    # 앱 한 세션은 화면을 보는 시간 평균 약 5분, 백그라운드 포함 약 21분이다(GA4 앱, 9/24~10/21).
    # 한 세션과 잠깐 나갔다 오는 경우를 덮고, 틀려도 30분 안에 고쳐진다.
    # 상한은 항목 수가 아니라 지역 줄 수 합이다. 1줄 약 200B라 20만 줄 ≈ 40MB, 회원 1명 약 50줄이면 약 4,000명분.
    cache:
      maximum-weight: 200000
      time-to-live: 30m
  list:
    # 회원별 일지 목록 페이지를 서버 메모리에 둔다. 지도 요약과 같은 때(일지 생성·수정·삭제, 태그 이름 변경·삭제 커밋) 그 회원 것을 지운다.
    # 썸네일은 objectKey만 두고, 5분짜리 서명 URL은 응답할 때마다 새로 만든다.
    # TTL은 지도 요약과 같은 30분. 상한은 일지 수 합이다. 일지 1건 약 0.5~1KB라 5만 건 ≈ 25~50MB로 지도 요약(약 40MB)과 비슷하다.
    cache:
      maximum-weight: 50000
      time-to-live: 30m

place:
  # 회원별 한도. 서버 여러 대가 함께 세도록 DB(place_rate_limit_bucket)에서 센다.
  rate-limit:
    searches-per-member-per-minute: 20
    selections-per-member-per-day: 100

group:
  invitation:
    # 초대 미리보기·수락을 합쳐 회원별로 센다. 6자리 코드를 아무거나 넣어 보는 시도를 막는다.
    # 서버마다 메모리에서 센다.
    rate-limit:
      per-member-per-minute: 10
      per-member-per-day: 50

upload:
  policy:
    max-file-size: 10MB
    max-files-per-request: 100
  # 회원별 업로드 URL 발급 한도. 파일 수로 세고 서버마다 메모리에서 센다.
  # 시간 한도는 100장짜리 기록 세 개를 한 번에 올릴 수 있는 양이다. 이 값으로 회원 한 명이 하루에 쓸 수 있는 저장량은 최대 10GB다.
  rate-limit:
    files-per-member-per-hour: 300
    files-per-member-per-day: 1000
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:mapmory-local}
      region: ${AWS_REGION:ap-northeast-2}
      # 공용 버킷에서 우리 객체를 모으기 위한 접두사. 필수이며, 비어 있으면 기동이 실패한다.
      key-prefix: ${AWS_S3_KEY_PREFIX:}
      # 업로드·조회·다운로드 서명 URL의 유효시간. CloudFront 서명 URL도 같은 값을 쓴다.
      signed-url-expiration: PT5M
      # 사진 확인(HEAD)은 dev EC2에서 잰 응답 p99가 95ms라(2026-11-04, 200번) 한 번 시도를 1초로 끊고 다시 보낸다.
      # HEAD는 다시 보내도 안전하고, 느린 요청은 다시 보내면 다른 경로로 빨리 끝나는 경우가 많다(AWS S3 성능 가이드).
      # 재시도를 합쳐도 호출 하나는 3초 안에 끝나, S3가 멈춰도 요청 스레드를 오래 쥐지 않는다.
      # 공유 영상 업로드는 크기에 따라 시간이 달라 따로 둔다. 지금 가장 큰 영상은 4.2MB로 서버 기본 대역폭(약 128Mbps)에서도
      # 0.3초쯤이라, 10초면 100MB가 넘는 영상까지 버틴다. 업로드는 백그라운드 워커가 하므로 사용자가 기다리지 않는다.
      client:
        attempt-timeout: 1s
        total-timeout: 3s
        max-attempts: 3
        video-upload-attempt-timeout: 10s
        video-upload-total-timeout: 30s
        delete-attempt-timeout: 10s
        delete-total-timeout: 30s

media:
  view:
    # 사진 조회 URL을 CloudFront 서명 URL로 낸다. 끄면 S3 presigned GET으로 돌아간다.
    # 배포 원본 경로가 공용 버킷의 우리 폴더(mapmory)라, Object Key 앞의 그 값을 빼고 서명한다.
    # 유효시간은 upload.storage.s3.signed-url-expiration을 같이 쓴다.
    cdn:
      enabled: ${CLOUDFRONT_ENABLED:false}
      domain: ${CLOUDFRONT_DOMAIN:}
      origin-path: ${CLOUDFRONT_ORIGIN_PATH:mapmory}
      key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
      private-key-path: ${CLOUDFRONT_PRIVATE_KEY_PATH:}

share-video:
  worker:
    # 개발 환경에서 먼저 부하를 확인한 뒤 true로 켠다.
    enabled: ${SHARE_VIDEO_WORKER_ENABLED:false}
    # 앞 작업이 끝난 뒤 이 시간만큼 기다렸다가 다음 PENDING 작업을 확인한다.
    poll-delay: ${SHARE_VIDEO_WORKER_POLL_DELAY:3s}
    renderer-directory: ${SHARE_VIDEO_RENDERER_DIRECTORY:${user.dir}/../video-renderer}
    work-directory: ${SHARE_VIDEO_WORK_DIRECTORY:${java.io.tmpdir}/mapmory/share-videos}
    render-timeout: ${SHARE_VIDEO_RENDER_TIMEOUT:10m}
    npm-command: ${SHARE_VIDEO_NPM_COMMAND:npm}

notification:
  fcm:
    enabled: ${NOTIFICATION_FCM_ENABLED:false}
    project-id: ${FCM_PROJECT_ID:}
  outbox:
    # 앨범 알림 아웃박스를 이 서버가 비울지. API를 받지 않는 렌더러 서버에서는 false로 끈다.
    enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
    # 앞 차례가 끝난 뒤 이 시간만큼 기다렸다가 보낼 차례인 알림을 다시 본다.
    poll-delay: ${NOTIFICATION_OUTBOX_POLL_DELAY:2s}

waitlist:
  cors:
    allowed-origins: ${WAITLIST_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173,https://map-mory.com,https://www.map-mory.com}

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug
    org.springframework.boot.autoconfigure: debug

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - prometheus
      discovery:
        enabled: false

  endpoint:
    health:
      access: read-only
      show-details: never
    prometheus:
      access: read-only

  metrics:
    tags:
      service: ${spring.application.name}
      version: ${APP_VERSION:unknown}

    distribution:
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s
        mapmory.operation.duration: 5s
      percentiles:
        http.server.requests:
          - 0.5
          - 0.95
          - 0.99
        mapmory.operation.duration:
          - 0.95
          - 0.99
