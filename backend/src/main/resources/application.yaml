spring:
  application:
    name: mapmory-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 서명 키(jwt.secret)는 프로파일별로 주입한다. (local: application-local, prod: 환경변수)
  access-token-validity: PT30M
  refresh-token-validity: P14D
  # 게스트 전용. 만료되면 복구 수단이 없으므로 회원(14일)보다 길게 둔다. (ADR 0015)
  guest-refresh-token-validity: P365D

guest-login:
  rate-limit:
    # 게스트는 인증 없이 생성되므로 출처별로 제한한다. 이동통신 NAT로 여러 사용자가 한 IP를
    # 공유할 수 있어, 정상 사용을 막지 않을 만큼 넉넉히 두고 스크립트 남용만 걸러낸다. (ADR 0015)
    capacity: 60
    window: 1h

kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me

google:
  # ID token의 aud로 허용할 OAuth 클라이언트 ID 목록(쉼표 구분). Android Credential Manager는
  # serverClientId로 지정한 웹 클라이언트 ID를, iOS SDK는 iOS 클라이언트 ID를 aud로 넣는다.
  # 비어 있으면 모든 구글 로그인을 거부한다. (ADR 0019)
  client-ids: ${GOOGLE_CLIENT_IDS:}
  jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  places:
    # Places API (New) 키. 비어 있으면 장소 검색은 Geoapify를 쓴다. (docs/place-search.md)
    api-key: ${GOOGLE_PLACES_API_KEY:}
    rate-limit:
      # 월 무료 사용량(Autocomplete 10,000건, Place Details Essentials 10,000건)을 넘지 않도록 하루 한도를 둔다.
      autocomplete-per-day: 300
      details-per-day: 300
      requests-per-second: 4

geoapify:
  api-key: ${GEOAPIFY_API_KEY:}
  rate-limit:
    searches-per-member-per-minute: 20
    selections-per-member-per-day: 100
    searches-per-day: 2000
    selections-per-day: 400
    requests-per-day: 2800
    requests-per-second: 4

upload:
  policy:
    max-file-size: 10MB
    max-files-per-request: 100
    presigned-url-expiration: PT5M
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:mapmory-local}
      region: ${AWS_REGION:ap-northeast-2}
      # 공용 버킷에서 우리 객체를 모으기 위한 접두사. 전용 버킷이면 비워 둔다.
      key-prefix: ${AWS_S3_KEY_PREFIX:}

waitlist:
  cors:
    allowed-origins: ${WAITLIST_ALLOWED_ORIGINS:http://localhost:4173,http://localhost:5173,https://map-mory.com,https://www.map-mory.com}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug
    org.springframework.boot.autoconfigure: debug

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - prometheus
      discovery:
        enabled: false

  endpoint:
    health:
      access: read-only
      show-details: never
    prometheus:
      access: read-only

  metrics:
    tags:
      service: ${spring.application.name}
      version: ${APP_VERSION:unknown}

    distribution:
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s
        mapmory.operation.duration: 5s
      percentiles:
        http.server.requests: 0.95
        mapmory.operation.duration: 0.95
