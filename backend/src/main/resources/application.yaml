spring:
  application:
    name: mapmory-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # 서명 키(jwt.secret)는 프로파일별로 주입한다. (local: application-local, prod: 환경변수)
  access-token-validity: PT30M
  refresh-token-validity: P14D

kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: debug
    org.springframework.boot.autoconfigure: debug
