<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>Mapmory 강원특별자치도 시·군·구 지도 화면</title>
  <desc>Mapmory 프로토타입의 다크 모드 지도 화면을 기준으로 만든 강원특별자치도 상세 지도 시안</desc>

  <rect width="390" height="844" fill="#121518"/>
  <rect y="0" width="390" height="844" fill="#0C1018"/>

  <!-- 상단 브랜드와 지도 범위 토글 -->
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <text x="18" y="39" fill="#F4F8F5" font-size="18" font-weight="800" letter-spacing="-0.8">Map<tspan fill="#67D9A2">mory</tspan></text>

    <rect x="198" y="14" width="174" height="42" rx="14" fill="#151C19" stroke="#2D3A34"/>
    <rect x="203" y="19" width="82" height="32" rx="10" fill="#2A3832"/>
    <text x="218" y="40" fill="#EEF7F1" font-size="16" font-weight="700">⌖</text>
    <text x="238" y="39" fill="#EEF7F1" font-size="11" font-weight="800">대한민국</text>
    <text x="300" y="40" fill="#92A09A" font-size="16" font-weight="700">◎</text>
    <text x="321" y="39" fill="#92A09A" font-size="11" font-weight="800">전세계</text>
  </g>

  <!-- 실제 프로토타입의 상단 대시보드 -->
  <g font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <rect x="0" y="66" width="390" height="122" rx="0 0 16 16" fill="#121518" stroke="#2A3834"/>
    <rect x="16" y="77" width="358" height="26" rx="8" fill="#173B2D"/>
    <text x="27" y="94" fill="#9CE6BF" font-size="10" font-weight="750">← 강원특별자치도 전체에서 나가기</text>

    <text x="16" y="123" fill="#BDC6C2" font-size="10" font-weight="700">나의 대한민국 지도</text>
    <text x="16" y="146" fill="#35C987" font-size="22" font-weight="800">2<tspan fill="#89938F" font-size="13" font-weight="700"> / 17</tspan></text>
    <rect x="321" y="127" width="53" height="23" rx="8" fill="#173B2D"/>
    <text x="331" y="142" fill="#9CE6BF" font-size="10" font-weight="700">1% 채움</text>

