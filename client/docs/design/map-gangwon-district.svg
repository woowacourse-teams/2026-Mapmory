    <rect x="18" y="207" width="44" height="32" rx="10" fill="#35C987"/>
    <text x="30" y="227" fill="#071B12">전체</text>
    <rect x="69" y="207" width="53" height="32" rx="10" fill="#1A2421"/>
    <text x="81" y="227" fill="#BDC8C2">가족</text>
