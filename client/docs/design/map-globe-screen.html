<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>Mapmory 전세계 지구본 화면</title>
  <style>
    :root {
      --canvas: #0b1116;
      --surface: #11181e;
      --line: #263039;
      --accent: #66d39b;
      --text: #f0f4f2;
      --muted: #8b9792;
      --land: #303b4d;
      --land-line: #68758a;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 390px;
      height: 844px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font);
    }

    button { font: inherit; }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: linear-gradient(180deg, #0d1216 0%, #090f14 100%);
    }

    .topbar {
      display: flex;
      height: 66px;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .brand {
      color: var(--text);
      font-size: 19px;
      font-weight: 850;
      letter-spacing: -1.1px;
    }

    .brand span { color: #dce7e2; }

    .scope-switch {
      display: flex;
      width: 176px;
      height: 45px;
      padding: 4px;
      border: 1px solid #202a30;
      border-radius: 17px;
      background: #11171b;
    }

    .scope {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: #707b77;
      font-size: 11px;
      font-weight: 750;
    }

    .scope.active {
      background: #252d2b;
      color: #e9f6ef;
      box-shadow: inset 0 0 0 1px #37443e;
    }

    .scope-icon { font-size: 15px; line-height: 1; }

    .summary {
      position: absolute;
      top: 66px;
      left: 12px;
      width: 366px;
      height: 88px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgb(17 24 30 / 78%);
    }

    .summary-label {
      margin: 0 0 6px;
      color: #94a09b;
      font-size: 11px;
      font-weight: 700;
    }

    .summary-value {
      color: var(--accent);
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .summary-value span {
      color: #9aa39f;
      font-size: 14px;
      letter-spacing: 0;
    }

    .fill-rate {
      position: absolute;
      top: 43px;
      right: 18px;
      padding: 9px 13px;
      border-radius: 13px;
      background: #19352a;
      color: #b9ecd3;
      font-size: 11px;
      font-weight: 800;
    }

    .filters {
      position: absolute;
      top: 167px;
      left: 18px;
      display: flex;
      gap: 8px;
    }

    .filter {
      height: 33px;
      padding: 0 13px;
      border: 0;
      border-radius: 12px;
      background: #17201f;
      color: #aab5b0;
      font-size: 11px;
      font-weight: 750;
    }

    .filter.active {
      background: var(--accent);
      color: #0c1c15;
    }

    .globe {
      position: absolute;
      top: 225px;
      left: 10px;
      width: 370px;
      height: 370px;
      overflow: visible;
      filter: drop-shadow(0 0 18px rgb(42 76 91 / 32%));
    }

    .country {
      fill: var(--land);
      stroke: var(--land-line);
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }

    .country.visited {
      fill: var(--accent);
      stroke: #a5efca;
      stroke-width: 1.7;
    }

    .round-button {
      position: absolute;
      bottom: 94px;
      display: grid;
      width: 47px;
      height: 47px;
      place-items: center;
      border: 1px solid #33463e;
      border-radius: 50%;
      background: #15201e;
      color: #d9e8e1;
    }

    .locate { left: 27px; font-size: 18px; }

    .add {
      right: 28px;
      border-color: transparent;
      background: var(--accent);
      color: #0a2017;
      font-size: 28px;
      font-weight: 300;
    }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      height: 64px;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #283139;
      background: #0d1317;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #7d8985;
      font-size: 10px;
      font-weight: 700;
    }

    .nav-item.active { color: var(--accent); }

    .nav-item svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
  </style>
</head>

      <div class="scope-switch" aria-label="지도 범위 선택">

        <button class="scope active" type="button"><span class="scope-icon">◎</span>전세계</button>

      <div class="fill-rate">3% 채움</div>
