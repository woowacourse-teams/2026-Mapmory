<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapmory 대한민국 지도 · Dark</title>
  <style>
    :root {
      --canvas: #0B141A;
      --surface: #121D24;
      --raised: #1A262F;
      --line: #29404A;
      --accent: #21E69A;
      --accent-soft: #153C32;
      --text: #F0FFF8;
      --muted: #B9CBBC;
      --danger: #FF6264;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 390px;
      min-height: 100%;
      background: #050D10;
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    button { font: inherit; }

    .screen {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--canvas);
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
    }

    .topbar {
      display: flex;
      align-items: center;
      height: 66px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: var(--canvas);
    }

    .brand {
      color: var(--accent);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -.06em;
    }

    .brand span { color: var(--text); }

    .caption {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
    }

    .theme-icon {
      display: grid;
      width: 30px;
      height: 30px;
      margin-left: 10px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--accent);
      font-size: 16px;
    }

    .summary {
      padding: 16px 16px 14px;
      border-bottom: 1px solid var(--line);
      border-radius: 0 0 18px 18px;
      background: var(--surface);
    }

    .summary-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .summary-count {
      margin-top: 2px;
      color: var(--text);
      font-size: 20px;
      font-weight: 850;
      line-height: 1;
    }

    .summary-count strong {
      color: var(--accent);
      font-size: 26px;
    }

    .percent {
      padding: 7px 10px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-size: 10px;
      font-weight: 750;
    }

    .filters {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    .filter {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--raised);
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }

    .filter.is-selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #071C15;
    }

    .map-area {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 48% 46%, rgb(33 230 154 / 9%), transparent 36%),
        var(--canvas);
    }

    .map-art {
      position: absolute;
      inset: 18px 36px 76px;
    }

    .map-art img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 18px rgb(0 0 0 / 28%));
    }

    .province-shape {
      fill: url(#province-fill);
      stroke: #49636B;
      stroke-width: .9;
    }

    .district-line {
      fill: none;
      stroke: #3D5861;
      stroke-width: .65;
      opacity: .95;
    }

    .selected-area {
      fill: url(#selected-fill);
      stroke: var(--accent);
      stroke-width: 1.2;
      filter: drop-shadow(0 0 3px rgb(33 230 154 / 55%));
    }

    .map-label {
      fill: var(--text);
      font-size: 7px;
      font-weight: 750;
      paint-order: stroke;
      stroke: var(--canvas);
      stroke-width: 2px;
    }

    .location-pill {
      position: absolute;
      right: 18px;
      bottom: 74px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
    }

    .alert {
      position: absolute;
      left: 18px;
      bottom: 24px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--danger);
      color: white;
      font-size: 20px;
      font-weight: 850;
      box-shadow: 0 8px 18px rgb(255 98 100 / 28%);
    }

    .add {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #071C15;
      font-size: 36px;
      font-weight: 300;
      line-height: 1;
      box-shadow: 0 10px 26px rgb(33 230 154 / 25%);
    }

    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: 78px;
      padding: 0 30px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .nav-item {
      display: flex;
      min-width: 64px;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #72888D;
      font-size: 10px;
      font-weight: 650;
    }

    .nav-icon {
      font-size: 19px;
      line-height: 1;
    }

    .nav-item.is-selected { color: var(--accent); }

    @media (max-width: 440px) {
      body { padding: 0; }
      .screen {
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
