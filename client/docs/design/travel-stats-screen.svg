<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Mapmory 여행 통계 화면</title>
  <desc id="desc">방문 국가와 지역, 여행 기록과 사진 수를 보여주는 다크 모드 통계 화면</desc>
  <defs>
    <clipPath id="passport-map-clip"><rect x="34" y="174" width="322" height="162" rx="16"/></clipPath>
    <linearGradient id="map-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101F27"/>
      <stop offset="1" stop-color="#07171B"/>
    </linearGradient>
  </defs>

  <g id="travel-stats-screen" data-component="screen">
    <rect id="screen-background" data-component="background" width="390" height="844" fill="#07171B"/>

    <g id="stats-header" data-component="header">
      <text id="eyebrow" x="20" y="43" fill="#19E5A2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">MY TRAVEL DATA</text>
      <text id="screen-title" x="20" y="78" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="800">여행 통계</text>
      <g id="settings-button" data-component="icon-button" aria-label="통계 설정">
        <rect x="334" y="24" width="38" height="38" rx="12" fill="#0C2026" stroke="#1B363E"/>
        <circle cx="353" cy="43" r="7" fill="none" stroke="#81999E" stroke-width="1.6"/>
        <circle cx="353" cy="43" r="2.5" fill="none" stroke="#81999E" stroke-width="1.5"/>
        <path d="M353 32V35M353 51V54M342 43H345M361 43H364M345.2 35.2L347.3 37.3M358.7 48.7L360.8 50.8M360.8 35.2L358.7 37.3M347.3 48.7L345.2 50.8" stroke="#81999E" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <g id="passport-card" data-component="passport-card">
      <rect x="18" y="128" width="354" height="248" rx="20" fill="#0C2026" stroke="#1B363E"/>
      <g id="passport-heading" data-component="card-heading">
        <text x="36" y="160" fill="#19E5A2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">MAPMORY PASSPORT</text>
        <text x="354" y="160" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700" text-anchor="end">도우너의 방문 지도</text>
      </g>
      <g id="passport-map" data-component="map-preview" clip-path="url(#passport-map-clip)">
        <rect x="34" y="174" width="322" height="162" rx="16" fill="url(#map-glow)" stroke="#1B363E"/>
        <g id="world-map-shapes" fill="#202C34" stroke="#31434A" stroke-width="0.8" stroke-linejoin="round">
          <path d="M54 206L64 196L84 192L99 198L113 194L127 204L122 214L108 218L101 230L87 224L77 230L65 224Z"/>
          <path d="M114 234L127 240L134 257L130 274L121 291L119 311L111 322L104 311L108 293L102 278L108 260L103 247Z"/>
          <path d="M167 205L180 198L196 199L208 207L203 218L190 221L184 230L171 224L162 214Z"/>
          <path d="M178 231L191 230L200 241L205 254L199 266L204 279L197 296L188 302L181 294L184 279L177 267L181 253L173 244Z"/>
          <path d="M208 198L221 193L236 198L246 207L265 210L276 219L270 229L255 228L247 237L232 233L220 239L208 230L213 218L204 211Z"/>
          <path d="M260 246L274 240L287 246L294 259L288 270L293 280L286 291L274 288L270 276L261 270L265 258L256 253Z"/>
          <path d="M303 302L316 296L330 302L340 315L335 326L320 328L308 321Z"/>
        </g>
        <g id="visited-countries" data-component="visited-region" fill="#19E5A2" stroke="#6EEFC1" stroke-width="0.8">
          <path d="M228 214L237 210L246 213L248 219L241 223L232 221L226 218Z"/>
          <circle cx="251" cy="229" r="3"/>
          <path d="M286 271L291 275L289 282L285 280L283 275Z"/>
          <path d="M119 320L124 319L128 323L124 327L118 326Z"/>
        </g>
      </g>
      <g id="passport-legend" data-component="legend">
        <rect x="37" y="349" width="10" height="10" rx="3" fill="#19E5A2"/>
        <text x="55" y="358" fill="#B9CBBC" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10">색칠된 국가는 여행 일지가 있는 곳이에요</text>
      </g>
    </g>

    <g id="progress-card" data-component="stats-card">
      <rect x="18" y="391" width="354" height="372" rx="20" fill="#0C2026"/>
      <g id="world-progress" data-component="progress-indicator">
        <text x="38" y="431" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">전세계 방문률</text>
        <text x="38" y="477" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">5<tspan dx="6" fill="#19E5A2" font-size="12" font-weight="700">개국</tspan></text>
        <rect x="38" y="498" width="314" height="10" rx="5" fill="#07171B"/>
        <rect x="38" y="498" width="10" height="10" rx="5" fill="#19E5A2"/>
      </g>
      <line id="progress-divider-1" x1="38" y1="530" x2="352" y2="530" stroke="#1B363E"/>
      <g id="korea-progress" data-component="progress-indicator">
        <text x="38" y="566" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">대한민국 방문률</text>
        <text x="38" y="612" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">2<tspan dx="6" fill="#19E5A2" font-size="12" font-weight="700">지역</tspan></text>
        <rect x="38" y="635" width="314" height="10" rx="5" fill="#07171B"/>
        <rect x="38" y="635" width="10" height="10" rx="5" fill="#19E5A2"/>
      </g>
      <line id="progress-divider-2" x1="38" y1="666" x2="352" y2="666" stroke="#1B363E"/>
      <g id="summary-metrics" data-component="metric-row">
        <g id="record-count" data-component="metric">
          <text x="38" y="701" fill="#81999E" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10">여행 기록</text>
          <text x="38" y="731" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800">7</text>
        </g>
        <g id="photo-count" data-component="metric">
          <text x="224" y="701" fill="#81999E" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10">사진</text>
          <text x="224" y="731" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800">45</text>
        </g>
      </g>
    </g>

    <g id="ranking-card" data-component="ranking-card">
      <rect x="18" y="778" width="354" height="120" rx="20" fill="#0C2026"/>
      <text x="38" y="807" fill="#E9F4F2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="12" font-weight="700">가장 많이 방문한 곳</text>
    </g>

    <g id="bottom-navigation" data-component="bottom-navigation">
      <rect x="0" y="764" width="390" height="80" fill="#07171B" stroke="#1B363E"/>
      <g id="nav-map" data-component="nav-item">
        <path d="M52 787L60 784L70 787L78 784V807L70 810L60 807L52 810Z M60 784V807 M70 787V810" fill="none" stroke="#81999E" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="65" y="828" fill="#81999E" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10" text-anchor="middle">지도</text>
      </g>
      <g id="nav-journal" data-component="nav-item">
        <rect x="148" y="784" width="6" height="6" rx="1" fill="none" stroke="#81999E" stroke-width="1.5"/>
        <line x1="160" y1="787" x2="177" y2="787" stroke="#81999E" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="148" y="794" width="6" height="6" rx="1" fill="none" stroke="#81999E" stroke-width="1.5"/>
        <line x1="160" y1="797" x2="177" y2="797" stroke="#81999E" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="148" y="804" width="6" height="6" rx="1" fill="none" stroke="#81999E" stroke-width="1.5"/>
        <line x1="160" y1="807" x2="177" y2="807" stroke="#81999E" stroke-width="1.6" stroke-linecap="round"/>
        <text x="163" y="828" fill="#81999E" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10" text-anchor="middle">일지</text>
      </g>
      <g id="nav-stats" data-component="nav-item" data-active="true">
        <rect x="240" y="778" width="112" height="66" fill="#0C2026" stroke="#19E5A2" stroke-width="2"/>
        <path d="M270 810V796M279 810V789M288 810V801M264 812H294" fill="none" stroke="#19E5A2" stroke-width="2" stroke-linecap="round"/>
        <text x="279" y="828" fill="#19E5A2" font-family="Be Vietnam Pro, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="10" font-weight="700" text-anchor="middle">통계</text>
      </g>
    </g>
  </g>
</svg>
