<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapmory Onboarding</title>
  <style>
    :root {
      --canvas: #0b141a;
      --surface: #121d24;
      --surface-raised: #1a262f;
      --surface-high: #202d36;
      --text: #f0fff8;
      --muted: #b9cbbc;
      --muted-2: #849587;
      --accent: #21e69a;
      --accent-soft: #9affcf;
      --line: #34434b;
      --radius-card: 20px;
      --radius-button: 14px;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 390px;
      background: #071015;
      color: var(--text);
      font-family: var(--font);
    }

    .canvas {
      display: flex;
      gap: 32px;
      min-height: 100vh;
      padding: 40px;
      overflow-x: auto;
      align-items: flex-start;
    }

    .screen {
      position: relative;
      flex: 0 0 390px;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: var(--canvas);
    }

    .skip {
      position: absolute;
      z-index: 2;
      top: 28px;
      right: 24px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      text-decoration: none;
    }

    .screen-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 92px 24px 24px;
    }

    .screen-1 .screen-content { padding-top: 96px; }

    .screen-title {
      margin: 0;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 1.28;
      text-align: center;
    }

    .screen-description {
      margin: 16px 0 0;
      color: var(--text);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1.65;
      text-align: center;
      word-break: keep-all;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: auto;
    }

    .indicators {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #3d464f;
    }

    .indicator.active { background: var(--accent); }

    .primary-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--accent);
      color: #071c15;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
      cursor: pointer;
    }

    .button-arrow {
      display: inline-block;
      margin-left: 8px;
      font-size: 28px;
      line-height: 0;
      vertical-align: -2px;
    }

    /* Screen 1: map-first introduction */
    .world-map {
      width: calc(100% + 48px);
      margin: 36px -24px 0;
    }

    .world-map img {
      display: block;
      width: 100%;
      height: auto;
    }

    .map-copy { margin-top: auto; }

    .map-copy .screen-description { color: var(--muted); }

    /* Screen 2: photo first, copy second */
    .screen-2 .screen-content { padding-top: 86px; }

    .memory-photo {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 300px;
      margin: 28px 0 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
    }

    .app-screen-shot {
      display: block;
      height: 100%;
      width: auto;
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, .28);
    }

    .screen-2 .screen-title { font-size: 27px; }

    .screen-2 .screen-description {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .detail-list {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .detail-chip {
      padding: 6px 10px;
      border: 1px solid #46545a;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      line-height: 16px;
    }

    /* Screen 3: a more ownable memory illustration */
    .memory-illustration {
      display: grid;
      place-items: center;
      flex: 0 0 280px;
      height: 280px;
      margin: 32px 0 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface-raised);
    }

    .memory-illustration .app-screen-shot {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .screen-3 .screen-title { font-size: 27px; }

    .screen-3 .screen-description {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .canvas { gap: 0; padding: 0; }
      .screen { flex-basis: 100vw; width: 100vw; }
    }

    /* Add ?screen=1, ?screen=2, or ?screen=3 when importing one frame at a time. */
    html[data-screen] .canvas {
      width: 390px;
      min-height: 844px;
      padding: 0;
      gap: 0;
      overflow: hidden;
    }

    html[data-screen="1"] .screen:not(.screen-1),
    html[data-screen="2"] .screen:not(.screen-2),
    html[data-screen="3"] .screen:not(.screen-3) {
      display: none;
    }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Mapmory 온보딩 화면 3개">
    <section class="screen screen-1" aria-label="온보딩 1번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="world-map" aria-label="여행 기록이 표시된 상세 세계 지도">
          <img src="assets/map-detail.png" alt="대륙 윤곽과 여행 기록 핀이 표시된 세계 지도">
        </div>

        <div class="map-copy">
          <h1 class="screen-title">여행을 지도에 남겨보세요</h1>
          <p class="screen-description">Mapmory와 함께라면 당신의 모든 여행이 지도가 됩니다.<br>다녀온 지역을 하나씩 채워보세요.</p>
        </div>

        <div class="actions">
          <div class="indicators" aria-label="1번째 화면, 전체 3개">
            <span class="indicator active"></span><span class="indicator"></span><span class="indicator"></span>
          </div>
          <button class="primary-button" type="button">다음 <span class="button-arrow">→</span></button>
        </div>
      </div>
    </section>

    <section class="screen screen-2" aria-label="온보딩 2번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="memory-photo" aria-label="장소와 날짜를 선택하는 여행 기록 작성 화면 미리보기">
          <img class="app-screen-shot" src="assets/record-editor-screen.png" alt="장소와 날짜를 선택하는 여행 기록 작성 화면">
        </div>

        <h1 class="screen-title">지역을 선택하고<br>여행을 기록해요</h1>
        <p class="screen-description">국가와 행정구역을 선택하고, 그곳에서의<br>특별한 추억을 기록으로 남길 수 있습니다.</p>
        <div class="detail-list" aria-label="기록에 포함할 수 있는 정보">
          <span class="detail-chip">장소</span><span class="detail-chip">날짜</span><span class="detail-chip">이야기</span>
        </div>

        <div class="actions">
          <div class="indicators" aria-label="2번째 화면, 전체 3개">
            <span class="indicator"></span><span class="indicator active"></span><span class="indicator"></span>
          </div>
          <button class="primary-button" type="button">다음</button>
        </div>
      </div>
    </section>

    <section class="screen screen-3" id="start" aria-label="온보딩 3번 화면">
      <a class="skip" href="#start">건너뛰기</a>
      <div class="screen-content">
        <div class="memory-illustration" aria-label="저장된 여행 기록 목록 화면 미리보기">
          <img class="app-screen-shot" src="assets/record-list-screen.png" alt="여행 기록 목록에 저장된 여행 기록 화면">
        </div>

        <h1 class="screen-title">사진은 나중에<br>추가해도 괜찮아요</h1>
        <p class="screen-description">꼭 사진이 없어도 괜찮습니다. 당신의 진솔한 기록만으로도<br>충분히 소중한 지도가 완성됩니다.</p>

        <div class="actions">
          <div class="indicators" aria-label="3번째 화면, 전체 3개">
            <span class="indicator"></span><span class="indicator"></span><span class="indicator active"></span>
          </div>
          <button class="primary-button" type="button">시작하기</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const requestedScreen = new URLSearchParams(window.location.search).get("screen");
    if (["1", "2", "3"].includes(requestedScreen)) {
      document.documentElement.dataset.screen = requestedScreen;
    }
  </script>
</body>
</html>
