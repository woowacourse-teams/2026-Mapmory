<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390, initial-scale=1">
  <title>Mapmory 통계 화면 코치 마크</title>
  <style>
    :root {
      --accent: #21e69a;
      --text: #f0fff8;
      --canvas: #0b141a;
      --font: "Be Vietnam Pro", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 390px;
      height: 844px;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font);
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: var(--canvas);
    }

    .base-screen {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .coach-marks,
    .scrim {
      position: absolute;
      inset: 0;
    }

    .coach-marks { z-index: 1; }

    .close {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 4;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgb(240 255 248 / 24%);
      border-radius: 50%;
      background: rgb(11 20 26 / 92%);
      color: var(--text);
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
    }

    .callout {
      position: absolute;
      z-index: 3;
      display: flex;
      width: 164px;
      min-height: 58px;
      gap: 8px;
      padding: 10px 11px;
      border: 1px solid rgb(33 230 154 / 72%);
      border-radius: 13px;
      background: rgb(11 20 26 / 96%);
      box-shadow: 0 8px 22px rgb(0 0 0 / 28%);
    }

    .number {
      display: grid;
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #071c15;
      font-size: 11px;
      font-weight: 900;
    }

    .copy {
      padding-top: 1px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: -.2px;
      line-height: 1.45;
      word-break: keep-all;
    }

    .passport-guide { top: 192px; right: 20px; }
    .visit-guide { top: 437px; right: 20px; }
    .summary-guide { top: 87px; left: 20px; }
  </style>
</head>
