# Merge only these locations into the EXISTING map-mory.com HTTPS server block.
# Reviewed configuration example; neither the build nor CodeDeploy applies it.
# Group invite links: https://map-mory.com/invite/{token} (token from the backend's inviteUrl).
# Android (assetlinks.json) and iOS (apple-app-site-association) read these files
# over HTTPS with no redirect, as application/json.
# add_header inside a location drops the server block's add_header lines (HSTS etc.):
# repeat them in each location below if the server block has any.
location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "max-age=3600" always;
    try_files $uri =404;
}
# Every invite link shows the same static page when the app does not open it.
location = /invite {
    return 308 /invite/$is_args$args;
}
location ^~ /invite/ {
    # The path holds a live invite token (valid for one day): keep it out of the access log.
    access_log off;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    try_files /invite/index.html =404;
}
