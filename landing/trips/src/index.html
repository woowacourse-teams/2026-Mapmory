<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="휴대폰에서 선택한 사진을 위치와 촬영일별로 정리하고 원본 그대로 ZIP으로 내려받으세요. 사진은 기기 안에서 처리됩니다." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' blob: data: https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; worker-src 'self'; frame-src https://docs.google.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>사진 정리하기 · Mapmory</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="app" class="start-screen">
      <button id="start-button" class="button button-primary start-button" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg>
        여행 사진 정리하기
      </button>
    </main>
    <input id="photo-input" type="file" accept=".jpg,.jpeg,.heic,.heif,.png,.tif,.tiff,.avif,.webp" multiple hidden />
    <input id="original-input" type="file" multiple hidden />
    <div id="announcements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript>사진을 정리하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
